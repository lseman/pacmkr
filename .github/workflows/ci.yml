name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC release
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizers: OFF
          - name: Clang ASan+UBSan
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: ON
    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm cmake openssl git clang

      - uses: actions/checkout@v6

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPACMKR_BUILD_TESTS=ON
          -DPACMKR_STRICT_WARNINGS=ON
          -DPACMKR_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --exclude-regex cli_integration
